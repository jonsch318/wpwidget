[package]
name = "wpwidget"
version = "0.1.0"
edition = "2024"
description = "A GNOME-style GTK audio device switcher for Waybar"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8"
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
