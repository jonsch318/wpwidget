name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  GTK4_LAYER_SHELL_VERSION: '1.3.0'

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-4-dev libwayland-dev \
            wayland-protocols meson ninja-build xvfb xauth dbus-x11 \
            adwaita-icon-theme

      # Build a pinned native library; Ubuntu 24.04 does not package it.
      - name: Build GTK4 layer-shell
        run: |
          git clone --depth 1 --branch "v$GTK4_LAYER_SHELL_VERSION" \
            https://github.com/wmww/gtk4-layer-shell.git \
            "$RUNNER_TEMP/gtk4-layer-shell"
          meson setup "$RUNNER_TEMP/gtk4-layer-shell/build" \
            "$RUNNER_TEMP/gtk4-layer-shell" \
            --prefix=/usr/local --libdir=lib --buildtype=release \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false
          meson compile -C "$RUNNER_TEMP/gtk4-layer-shell/build"
          sudo meson install -C "$RUNNER_TEMP/gtk4-layer-shell/build"
          sudo ldconfig
          pkg-config --modversion gtk4 gtk4-layer-shell-0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: gtk4-layer-shell-${{ env.GTK4_LAYER_SHELL_VERSION }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test, including GTK controls
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: |
          dbus-run-session -- xvfb-run -a \
            cargo test --locked -- --include-ignored --test-threads=1

      - name: Build release executable
        run: cargo build --release --locked

      - name: Smoke-test CLI
        run: |
          target/release/wpwidget --help
          target/release/wpwidget status --demo | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["percentage"] == 65'
          target/release/wpwidget status --demo --kind input | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["percentage"] == 80'

      - name: Package binary and configuration examples
        run: |
          mkdir -p dist/package
          install -m755 target/release/wpwidget dist/package/
          cp README.md dist/package/
          cp -r examples dist/package/
          tar -C dist/package -czf dist/wpwidget-linux-x86_64.tar.gz .
          cd dist
          sha256sum wpwidget-linux-x86_64.tar.gz > wpwidget-linux-x86_64.tar.gz.sha256

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: wpwidget-linux-x86_64
          path: |
            dist/wpwidget-linux-x86_64.tar.gz
            dist/wpwidget-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    needs: linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested build
        uses: actions/download-artifact@v8
        with:
          name: wpwidget-linux-x86_64
          path: dist

      - name: Verify archive checksum
        working-directory: dist
        run: sha256sum --check wpwidget-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(wpwidget-linux-x86_64.tar.gz wpwidget-linux-x86_64.tar.gz.sha256)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
          fi
